<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine's Day ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to bottom right, #ff9eb5, #ff4f81);
    text-align: center;
    color: white;
    overflow-x: hidden;
}

h1 {
    margin-top: 40px;
    font-size: 40px;
    animation: fadeIn 2s ease-in-out;
}

p {
    font-size: 20px;
    max-width: 600px;
    margin: auto;
    animation: fadeIn 3s ease-in-out;
}

.gallery {
    margin-top: 40px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
}

.gallery img {
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 20px;
    cursor: pointer;
    transition: transform 0.4s, box-shadow 0.4s;
}

.gallery img:hover {
    transform: scale(1.1);
    box-shadow: 0 10px 25px rgba(255,255,255,0.6);
}

/* Lightbox */
#lightbox {
    position: fixed;
    display: none;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
}

#lightbox img {
    max-width: 80%;
    max-height: 80%;
    border-radius: 20px;
}

/* Floating Hearts */
.heart {
    position: fixed;
    bottom: -10px;
    font-size: 24px;
    animation: floatUp 5s linear infinite;
    color: #fff;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
}

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}

footer {
    margin: 50px 0;
    font-size: 18px;
}
</style>
</head>

<body>

<h1>Happy Valentine’s Day My Love ❤️</h1>

<p>
You are the most beautiful part of my life.  
Every heartbeat of mine says your name.  
Thank you for filling my world with love and happiness. 💕
</p>

<div class="gallery">
    <img src="img1.jpeg" onclick="openLightbox(this.src)">
    <img src="img2.jpeg" onclick="openLightbox(this.src)">
    <img src="img3.jpg" onclick="openLightbox(this.src)">
    <img src="img4.jpg" onclick="openLightbox(this.src)">
</div>

<div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img">
</div>

<footer>
Made with ❤️ just for you
</footer>

<script>
// Lightbox
function openLightbox(src) {
    document.getElementById('lightbox').style.display = 'flex';
    document.getElementById('lightbox-img').src = src;
}
function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
}

// Floating Hearts
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);
}
setInterval(createHeart, 400);
</script>

</body>
</html>
